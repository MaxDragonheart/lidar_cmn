# Tests of the package on Linux, Windows and macOS.
# - offline: the tests that don't use the network, on every supported Python
#   version;
# - network: the tests on the servers of Città Metropolitana di Napoli, among
#   them the verification of the certificate of sit.cittametropolitana.na.it
#   (see docs/certificato_ssl.md), on the oldest and on the newest Python.
# The weekly run notices the changes of the server, e.g. a new certificate.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # rasterio reads the VRT in the tests of lidar_cmn.raster
      - name: Install the package
        run: python -m pip install . pytest rasterio
      - name: Offline tests
        run: python -m pytest -m "not network"

  network:
    name: Network (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # From Python 3.13 ssl.create_default_context verifies the
        # certificates with VERIFY_X509_STRICT and VERIFY_X509_PARTIAL_CHAIN
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package
        run: python -m pip install . pytest
      - name: Network tests
        run: python -m pytest -m network
